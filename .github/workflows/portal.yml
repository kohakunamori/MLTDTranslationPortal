name: 生成数据并部署 Pages

# 纯静态查阅站的完整流水线（没有服务器、没有数据库、没有 OAuth）：
#   0. check  —— 先判断"这次到底要不要重新生成"：上游 HEAD 没动、站点代码没动 → 后面全部跳过
#   1. verify —— 4 个离线契约测试（生成器 / 静态站点 / 单行写入 / AI 草稿）+ CI 判断逻辑自测
#   2. build  —— 浅克隆翻译仓库 → 生成 public/data/** → 复制图片到 public/media/**
#                → 校验每个图片地址都真的有文件 → 打包 Pages 产物（约 507 MB）
#   3. deploy —— 发布到 GitHub Pages（产物里就是全部内容，仓库里不存数据）
#
# 省配额的三条规矩：
#   * push：只有动了站点输入（public/ scripts/ package.json 工作流本身）才重建；
#           只改 docs/tests 时 build/deploy 直接跳过（测试照跑）。
#   * schedule（每天 03:17 UTC）：拿线上已发布的 portal.json 当缓存标记，
#           两个上游仓的 HEAD 与本仓 commit 都没变 → 跳过，一个字节都不重新拉/传。
#   * workflow_dispatch：手动触发，勾 force 可强制重建。
# 判断逻辑在 scripts/ci_decide.mjs（可本地跑 --self-test），不靠猜、读不到标记就老实重建。

on:
  push:
    # 接受 main 与 master：本地仓库当前在 master 上，别让首发部署因为分支名静默不触发
    branches: [main, master]
    # 故意**不含** docs/**：改文档不该触发 507 MB 的重新生成与部署
    paths:
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "test_helpers/**"
      - "package.json"
      - ".github/workflows/portal.yml"
  schedule:
    # 每天 03:17 UTC 看一眼上游；没变化就什么都不做
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 强制重新生成并部署（不填则自动跳过没变化的情况）
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 新的提交直接顶掉正在跑的旧任务（Pages 只在 deploy 成功那一刻切换，取消是安全的）
  group: portal-pages
  cancel-in-progress: true

env:
  ASSETS_REPO: kohakunamori/MLTDTranslationAssets
  CLIENT_REPO: kohakunamori/MLTDTranslationClient
  ASSETS_REF: main
  CLIENT_REF: main
  # 线上那份产物就是"缓存标记"：里面的 sources.*.head / sources.portal.commit
  SITE_URL: https://kohakunamori.github.io/MLTDTranslationPortal

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # push 事件要 diff 出这次改了哪些文件
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 这次需要重新生成吗
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || 'false' }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ env.SITE_URL }}/data/portal.json
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            # 首次推送/强推时 before 可能是全 0，diff 会失败 —— 那时清单为空，脚本保守重建
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
            export CHANGED_FILES
            node scripts/ci_decide.mjs --event push --github-output
          elif [ "$FORCE" = "true" ]; then
            node scripts/ci_decide.mjs --event "$EVENT" --force --github-output
          else
            node scripts/ci_decide.mjs \
              --event "$EVENT" \
              --assets "$ASSETS_REPO" --client "$CLIENT_REPO" \
              --deployed-url "$DEPLOYED_URL" \
              --portal-commit "$SHA" \
              --github-output
          fi

      - name: 把判断结果写进任务摘要
        if: always()
        run: |
          {
            echo "### 要不要重新生成：${{ steps.decide.outputs.build }}"
            echo ""
            echo "- 触发方式：\`${{ github.event_name }}\`"
            echo "- 原因：${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 离线契约测试
        run: npm test

  build:
    needs: [check, verify]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 只看需要的目录：locales/lyrics/manifests 是文本，images 是图片字节。
      # 上游仓库还有 400MB 的 generated/ 与本流程无关，sparse checkout 直接跳过。
      - name: 浅克隆翻译仓库（只取需要的目录）
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" ref="$2" dir="$3"; shift 3
            git clone --depth 1 --filter=blob:none --sparse --branch "$ref" "https://github.com/${repo}.git" "$dir"
            git -C "$dir" sparse-checkout set "$@"
            echo "${repo} @ $(git -C "$dir" rev-parse HEAD)"
          }
          mkdir -p vendor
          clone "$ASSETS_REPO" "$ASSETS_REF" vendor/MLTDTranslationAssets locales lyrics manifests images
          clone "$CLIENT_REPO" "$CLIENT_REF" vendor/MLTDTranslationClient manifests

      - name: 生成数据
        run: |
          set -euo pipefail
          node scripts/build_data.mjs \
            --assets-root vendor/MLTDTranslationAssets \
            --client-root vendor/MLTDTranslationClient \
            --out public/data \
            --assets-repo "$ASSETS_REPO" \
            --client-repo "$CLIENT_REPO" \
            --ref "$ASSETS_REF" \
            --portal-commit "$GITHUB_SHA"

      # 图片不进 git 仓库跟踪，随 Pages 产物发布：清单里的 relative_path 是
      # images/localized/<bundle>/<file>.png，生成器给出的是 media/localized/... 相对地址。
      - name: 复制图片到站点
        run: |
          set -euo pipefail
          src=vendor/MLTDTranslationAssets/images/localized
          if [ ! -d "$src" ]; then
            echo "::error::上游没有 images/localized 目录，图片页会全是占位符"
            exit 1
          fi
          mkdir -p public/media
          cp -R "$src" public/media/localized
          echo "图片文件数：$(find public/media -type f -name '*.png' | wc -l)"

      - name: 校验图片地址都有对应文件
        run: |
          node -e '
            const fs = require("fs");
            const images = JSON.parse(fs.readFileSync("public/data/images.json", "utf8"));
            const published = images.tasks.filter((task) => task.localized_url);
            const missing = published.filter((task) => !fs.existsSync(`public/${task.localized_url}`));
            if (missing.length) {
              console.error(`::error::${missing.length} 个图片地址没有文件，例如 ${missing[0].localized_url}`);
              process.exit(1);
            }
            console.log(`图片齐全：${published.length} 个地址全部有文件`);
          '

      - name: 校验产物
        run: |
          set -euo pipefail
          test -f public/data/portal.json
          test -f public/index.html
          node -e '
            const portal = require("./public/data/portal.json");
            console.log(`行 ${portal.totals.total} / 资源 ${portal.totals.bundles} / 文件 ${portal.totals.files} / 已译 ${portal.totals.progress_percent}%`);
            if (!portal.totals.total) { console.error("::error::一条译文都没有，拒绝部署空站点"); process.exit(1); }
          '
          echo "产物大小：$(du -sh public | cut -f1)"
          # 这次构建的"缓存标记"：下次 check 靠它判断能不能跳过
          node -e '
            const portal = require("./public/data/portal.json");
            console.log(`标记：assets.head=${portal.sources.assets.head} client.head=${portal.sources.client.head} portal=${portal.sources.portal.commit}`);
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
