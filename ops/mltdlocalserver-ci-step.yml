# 现成步骤：把 MLTDLocalServer 抓到的曲名同步到门户仓库（方案 A）
#
# 加到 MLTDLocalServer 的 workflow（.github/workflows/fullsave-ci.yml）里，
# 放在"抓包数据已发布/已提交"之后即可。它做三件事：
#   1. clone 公开的门户仓库（用 PORTAL_SYNC_TOKEN 推权限）；
#   2. 在门户检出里跑门户自带的导出脚本（读本仓的内容覆盖层）；
#   3. 数据真的变了才提交、推送；没变什么都不做。
#
# 一次性准备：
#   1. 建一个 fine-grained token：只勾 kohakunamori/MLTDTranslationPortal 这一个仓库，
#      权限只给 Contents: Read and write，其余全部留空，有效期按你的习惯（建议 1 年，到期换新）。
#   2. 在 MLTDLocalServer 仓库 Settings → Secrets and variables → Actions 新建 secret：
#      名字 PORTAL_SYNC_TOKEN，值是上面那个 token。
#   3. 确认 workflow 有 actions/checkout 与 node 环境（本步骤自带 setup-node）。
#
# 没有配置 secret 时本步骤只打一条 warning 就跳过，不会让 CI 变红。

- name: Sync song names to the public portal repo
  if: ${{ github.event_name != 'pull_request' }}
  env:
    PORTAL_SYNC_TOKEN: ${{ secrets.PORTAL_SYNC_TOKEN }}
  run: |
    if [ -z "$PORTAL_SYNC_TOKEN" ]; then
      echo "::warning::PORTAL_SYNC_TOKEN 未配置，跳过曲名同步（门户会继续用上一次的对照）"
      exit 0
    fi
    git clone --depth 1 --branch master \
      "https://x-access-token:${PORTAL_SYNC_TOKEN}@github.com/kohakunamori/MLTDTranslationPortal.git" \
      portal-sync
    cd portal-sync
    # 覆盖层库在这个检出里通常位于 fullsave/canonical/local-fullsave-content.sqlite，
    # 如果路径不同，改下面这一行即可。
    OVERLAY="${GITHUB_WORKSPACE}/fullsave/canonical/local-fullsave-content.sqlite"
    if [ ! -f "$OVERLAY" ]; then
      echo "::warning::没找到覆盖层库 $OVERLAY，跳过曲名同步"
      exit 0
    fi
    MLTD_LOCAL_SERVER="${GITHUB_WORKSPACE}" bash ops/publish-song-names.sh "$OVERLAY"

# 说明：
#   - 门户服务器每天 04:40（服务器本地时间）例行更新，会先 git pull 门户仓库；
#     所以这里推上去之后，最迟第二天就体现在站点上，不需要门户那边任何凭据。
#   - 门户仓库的自动构建已停用，这次推送不会触发门户的 Actions（不占额度）。
#   - 脚本自带安全阀：对照里出现"指向不存在曲目"的条目、或条数比上次少了 20% 以上，
#     都会中止且不提交。
